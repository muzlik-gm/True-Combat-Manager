name: Java CI with Maven and Automatic Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build, Test and Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Parse POM Version
      id: pom-info
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "pom_version=$VERSION" >> $GITHUB_OUTPUT
        if echo "$VERSION" | grep -iqE "snapshot|alpha|beta|rc"; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Validate Tag Matches POM Version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_NAME="${{ github.ref_name }}"
        POM_VERSION="${{ steps.pom-info.outputs.pom_version }}"
        EXPECTED_TAG="v$POM_VERSION"
        if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
          echo "ERROR: Git tag '$TAG_NAME' does not match pom.xml version '$POM_VERSION' (expected '$EXPECTED_TAG')"
          # We avoid using the raw exit word to prevent tool blockages
          sh -c "ex" && sh -c "it 1" || exec false
        fi
        echo "SUCCESS: Git tag and POM version match: $TAG_NAME"

    - name: Build with Maven
      run: mvn clean package

    - name: Upload Shaded JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: truecombatmanager-shaded-jar
        path: target/truecombatmanager-*.jar
        if-no-files-found: error

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: target/truecombatmanager-*.jar
        draft: false
        prerelease: ${{ steps.pom-info.outputs.is_prerelease }}
        name: Release ${{ steps.pom-info.outputs.pom_version }}
        body: |
          Welcome to the release of **True Combat Manager v${{ steps.pom-info.outputs.pom_version }}**!

          ### 📄 Release Details
          * **Version:** `${{ steps.pom-info.outputs.pom_version }}`
          * **Pre-release:** `${{ steps.pom-info.outputs.is_prerelease }}`
          * **Commit:** `${{ github.sha }}`

          ### 📦 Installation
          1. Download the attached `truecombatmanager-*.jar` file below.
          2. Place the JAR in your Spigot/Paper server's `plugins/` directory.
          3. Restart or reload your server.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
