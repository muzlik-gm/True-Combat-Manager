name: CI Pipeline - Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven Project
        run: mvn validate -B

      - name: Check Code Formatting
        run: mvn checkstyle:check -B || echo "Warning: Checkstyle issues found"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test -B

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/*.xml
          fail_on_failure: false

  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Parse POM Version
        id: pom-info
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "pom_version=$VERSION" >> $GITHUB_OUTPUT
          
          # Determine artifact type
          if echo "$VERSION" | grep -iqE "snapshot"; then
            echo "artifact_type=snapshot" >> $GITHUB_OUTPUT
          elif echo "$VERSION" | grep -iqE "alpha|beta|rc"; then
            echo "artifact_type=prerelease" >> $GITHUB_OUTPUT
          else
            echo "artifact_type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build with Maven
        run: mvn clean package -B -DskipTests

      - name: Verify Build Output
        run: |
          ls -lh target/*.jar
          file target/*.jar

      - name: Upload Shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: truecombatmanager-${{ steps.pom-info.outputs.pom_version }}
          path: target/truecombatmanager-${{ steps.pom-info.outputs.pom_version }}.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload Sources JAR
        uses: actions/upload-artifact@v4
        with:
          name: truecombatmanager-${{ steps.pom-info.outputs.pom_version }}-sources
          path: target/truecombatmanager-${{ steps.pom-info.outputs.pom_version }}-sources.jar
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Javadoc JAR
        uses: actions/upload-artifact@v4
        with:
          name: truecombatmanager-${{ steps.pom-info.outputs.pom_version }}-javadoc
          path: target/truecombatmanager-${{ steps.pom-info.outputs.pom_version }}-javadoc.jar
          if-no-files-found: ignore
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'TrueCombatManager'
          path: '.'
          format: 'HTML'
          out: 'reports'
        continue-on-error: true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/
          if-no-files-found: ignore
